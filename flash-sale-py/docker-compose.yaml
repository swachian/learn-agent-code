# ============================================
# Docker Compose for Local Development
# ============================================

version: '3.8'

services:
  # Flash Sale API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2'
          memory: 2Gi
        reservations:
          cpus: '0.5'
          memory: 512Mi
    networks:
      - flash-network

  # Consumer
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: python consumer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=flashsale
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - flash-network

  # Redis
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: |
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2Gi
    networks:
      - flash-network

  # Redis Cluster (3 nodes for testing)
  redis-cluster-1:
    image: redis:7.2-alpine
    command: |
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
    volumes:
      - redis-cluster-1:/data
    networks:
      - flash-network

  redis-cluster-2:
    image: redis:7.2-alpine
    command: |
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
    volumes:
      - redis-cluster-2:/data
    networks:
      - flash-network

  redis-cluster-3:
    image: redis:7.2-alpine
    command: |
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
    volumes:
      - redis-cluster-3:/data
    networks:
      - flash-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: 100
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 性能优化
      KAFKA_PRODUCER_BUFFER_MEMORY: 67108864
      KAFKA_PRODUCER_BATCH_SIZE: 16384
      KAFKA_PRODUCER_LINGER_MS: 5
      KAFKA_MESSAGE_MAX_BYTES: 1048576
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4Gi
    networks:
      - flash-network

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flash-network

  # PostgreSQL (用于订单落库)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flashsale
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1Gi
    networks:
      - flash-network

  # Locust Load Testing
  locust:
    image: locustio/locust:2.25.0
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locustfile.py
    command: >
      -f /mnt/locustfile.py
      --host=http://api:8000
      --headless
      -u 1000
      -r 100
      --run-time 60s
      --spawn-rate 100
    depends_on:
      - api
    networks:
      - flash-network

volumes:
  redis-data:
  redis-cluster-1:
  redis-cluster-2:
  redis-cluster-3:
  postgres-data:

networks:
  flash-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16